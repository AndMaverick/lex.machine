[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lex.machine"
version = "0.2.0"
description = "Regulation, compiled. Controls for the EU AI Act, NIST AI RMF, GDPR and ISO/IEC 42001 as data, checked against dated, digest-pinned evidence with three-valued logic, statistical fairness verdicts and a hash-chained audit history. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[project.scripts]
lex-machine = "lex_machine.cli:main"

[tool.setuptools.package-data]
lex_machine = ["py.typed", "packs/*.json"]

[tool.setuptools.packages.find]
include = ["lex_machine*"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["lex_machine"]
